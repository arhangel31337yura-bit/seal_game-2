name: Build Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer and cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Build APK with Buildozer
      id: build_step
      continue-on-error: true  # <--- Робот продолжит работу даже если сборка упадет
      run: |
        echo "y" | buildozer -v android debug 2>&1 | tee full_build_log.txt

    - name: Filter Errors to a file
      run: |
        echo "=== ГЛАВНЫЕ ОШИБКИ ===" > errors_only.txt
        grep -i -E "error|exception|traceback|failed" full_build_log.txt >> errors_only.txt || true
        echo -e "\n\n=== ПОСЛЕДНИЕ 50 СТРОК ЛОГА ===" >> errors_only.txt
        tail -n 50 full_build_log.txt >> errors_only.txt || true

    - name: Upload Errors Log
      uses: actions/upload-artifact@v4
      with:
        name: errors-log
        path: errors_only.txt

    - name: Upload APK Artifact
      if: steps.build_step.outcome == 'success' # Скачиваем APK только если сборка реально удалась
      uses: actions/upload-artifact@v4
      with:
        name: sealgame-apk
        path: bin/*.apk

    - name: Fail if build failed
      if: steps.build_step.outcome == 'failure' # Красим крестик в красный, если упало
      run: exit 1
      with:
        name: sealgame-apk
        path: bin/*.apk
