name: Ultra Fast Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Скачиваем наш кэш
    - name: Setup Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: docker-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          docker-v2-${{ runner.os }}-

    # 2. Собираем с помощью Docker
    - name: Build APK with Docker
      run: |
        docker run --rm \
          --entrypoint="" \
          -v "${{ github.workspace }}:/home/user/hostcwd" \
          -v "$HOME/.buildozer:/home/user/.buildozer" \
          -v "$HOME/.gradle:/home/user/.gradle" \
          -w /home/user/hostcwd \
          kivy/buildozer:latest \
          buildozer -v android debug

    # 3. Загружаем APK, если всё хорошо
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sealgame-apk
        path: bin/*.apk

    # 4. Загружаем логи (если что-то пошло не так)
    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: all-logs
        path: |
          .buildozer/android/platform/build-*/dists/*/build/outputs/logs/*
          bin/*.log
          *.log
        if-no-files-found: warn
