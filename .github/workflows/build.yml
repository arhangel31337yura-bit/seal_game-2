name: Ultra Fast Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Скачиваем наш кэш (чтобы не компилировать Python заново)
    - name: Setup Cache
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.gradle
        key: ultra-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ultra-${{ runner.os }}-

    # 2. Собираем с помощью Docker (Всё уже установлено внутри)
    - name: Build APK with Docker
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/home/user/hostcwd" \
          -v "${{ github.workspace }}/.buildozer:/home/user/.buildozer" \
          -v "${{ github.workspace }}/.gradle:/home/user/.gradle" \
          kivy/buildozer:latest \
          buildozer -v android debug

    # 3. Загружаем APK, если всё хорошо
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: sealgame-apk
        path: bin/*.apk

    # 4. Если ошибка — загружаем лог
    - name: Upload Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-log
        path: buildozer.log
