name: Build APK and Log Errors

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Install buildozer and cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Try Build
      continue-on-error: true
      run: |
        set -o pipefail
        echo "y" | buildozer -v android debug 2>&1 | tee build_log.txt

    # ЭТОТ ШАГ ТЕПЕРЬ СРАБОТАЕТ ВСЕГДА
    - name: Generate Error Log
      if: always()
      run: python parse_errors.py

    - name: Upload Logs (Always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build_log.txt
          errors_only.txt

    - name: Upload APK (If Exists)
      uses: actions/upload-artifact@v4
      with:
        name: sealgame-apk
        path: bin/*.apk
